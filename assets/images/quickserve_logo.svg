<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#2684FF" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5630" />
      <stop offset="100%" stop-color="#FF8F73" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(15, 15)">
    <!-- Outer Shield / Speed Icon Background -->
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#blueGrad)" />

    <!-- Service Bolt / Wrench Symbol -->
    <path d="M 45 25 L 75 25 C 80 25 85 30 83 36 L 73 55 L 85 55 C 90 55 92 62 87 67 L 45 102 C 40 106 35 100 38 94 L 48 70 L 36 70 C 31 70 29 63 34 58 L 45 25 Z" fill="#FFFFFF" />
    
    <!-- Fast Accent Chevron -->
    <path d="M 70 80 L 85 68 L 70 56" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography -->
  <!-- "Quick" -->
  <text x="155" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#091E42" letter-spacing="-1">Quick</text>
  
  <!-- "Serve" -->
  <text x="295" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="400" fill="#0052CC" letter-spacing="-0.5">Serve</text>

  <!-- Subtitle Tagline -->
  <text x="158" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#5E6C84" letter-spacing="2.5">SERVICE REQUEST MANAGEMENT</text>
</svg>
